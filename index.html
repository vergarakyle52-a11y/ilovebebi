<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>A Little Surprise For You</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap');

		:root {
			--ink: #2d2630;
			--muted: #786d79;
			--rose: #c95673;
			--rose-dark: #a93d5b;
			--cream: #fff9f3;
			--paper: rgba(255, 255, 255, 0.82);
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			color: var(--ink);
			font-family: 'DM Sans', sans-serif;
			background:
				radial-gradient(circle at 8% 15%, rgba(247, 189, 181, .55), transparent 25%),
				radial-gradient(circle at 92% 82%, rgba(246, 214, 160, .52), transparent 28%),
				linear-gradient(135deg, #f9e6e0 0%, var(--cream) 47%, #f6e9d7 100%);
			display: grid;
			place-items: center;
			padding: 32px 18px;
		}

		main {
			width: min(100%, 680px);
			padding: clamp(28px, 7vw, 64px) clamp(20px, 7vw, 72px);
			text-align: center;
			background: var(--paper);
			border: 1px solid rgba(255, 255, 255, .8);
			box-shadow: 0 24px 70px rgba(117, 70, 76, .16);
			backdrop-filter: blur(12px);
		}

		.eyebrow {
			margin: 0 0 14px;
			color: var(--rose);
			font-size: .76rem;
			font-weight: 700;
			letter-spacing: .18em;
			text-transform: uppercase;
		}

		h1, h2 { font-family: 'Playfair Display', Georgia, serif; }
		h1 {
			max-width: 470px;
			margin: 0 auto 16px;
			font-size: clamp(2.5rem, 8vw, 4.8rem);
			line-height: .98;
			letter-spacing: -.03em;
		}

		.intro {
			max-width: 430px;
			margin: 0 auto 34px;
			color: var(--muted);
			font-size: 1.05rem;
			line-height: 1.65;
		}

		.name-list {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 12px;
			margin: 0 auto;
		}

		.name-button {
			min-height: 64px;
			padding: 14px 16px;
			border: 1px solid rgba(201, 86, 115, .2);
			border-radius: 8px;
			color: var(--ink);
			background: rgba(255, 255, 255, .7);
			font: inherit;
			font-weight: 700;
			cursor: pointer;
			transition: transform .2s ease, color .2s ease, background .2s ease, box-shadow .2s ease;
		}

		.name-button:hover, .name-button:focus-visible {
			color: #fff;
			background: var(--rose);
			box-shadow: 0 10px 22px rgba(201, 86, 115, .23);
			transform: translateY(-3px);
			outline: none;
		}

		.boyfriend-section {
			margin-top: 28px;
			padding: 22px 18px 18px;
			border: 1px solid rgba(201, 86, 115, .25);
			background: rgba(255, 244, 241, .72);
		}

		.boyfriend-label {
			margin: 0 0 12px;
			color: var(--rose-dark);
			font-size: .78rem;
			font-weight: 700;
			letter-spacing: .14em;
			text-transform: uppercase;
		}

		.boyfriend-button {
			width: 100%;
			border-color: var(--rose);
			color: #fff;
			background: var(--rose);
		}

		.boyfriend-button:hover, .boyfriend-button:focus-visible {
			background: var(--rose-dark);
		}

		.signature {
			margin: 30px 0 0;
			color: var(--rose);
			font-family: 'Playfair Display', Georgia, serif;
			font-size: 1.1rem;
		}

		dialog {
			width: min(460px, calc(100% - 36px));
			padding: 0;
			border: 0;
			border-radius: 8px;
			color: var(--ink);
			background: #fffdfb;
			box-shadow: 0 24px 80px rgba(64, 35, 43, .28);
		}

		dialog::backdrop { background: rgba(56, 34, 44, .42); backdrop-filter: blur(4px); }
		dialog[open] .message-card { animation: popup-in .45s cubic-bezier(.2, .9, .3, 1.2) both; }
		.message-card { position: relative; overflow: hidden; padding: 38px 30px 30px; text-align: center; }
		.message-card::before, .message-card::after {
			position: absolute;
			color: rgba(201, 86, 115, .55);
			font-size: 1.4rem;
			content: '✦';
			animation: float-sparkle 2.8s ease-in-out infinite;
		}
		.message-card::before { top: 20px; left: 22px; }
		.message-card::after { right: 24px; bottom: 22px; animation-delay: .8s; }
		.message-image {
			display: none;
			width: 100%;
			height: 190px;
			margin-bottom: 22px;
			border-radius: 6px;
			object-fit: cover;
			box-shadow: 0 12px 24px rgba(117, 70, 76, .16);
		}
		.message-card.has-image .message-image { display: block; animation: image-reveal .7s .12s both; }
		.message-video {
			display: none;
			position: absolute;
			width: 1px;
			height: 1px;
			opacity: 0;
			pointer-events: none;
			border: 0;
		}
		.message-card.has-audio .message-video { display: block; }
		.message-mark { color: var(--rose); font-size: 2rem; line-height: 1; }
		h2 { margin: 18px 0 12px; font-size: 2rem; }
		#message-text { margin: 0 auto 28px; color: var(--muted); line-height: 1.7; }
		.close-button {
			border: 0;
			border-radius: 999px;
			padding: 12px 25px;
			color: #fff;
			background: var(--rose);
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}
		.close-button:hover, .close-button:focus-visible { background: var(--rose-dark); outline: 3px solid rgba(201, 86, 115, .2); outline-offset: 3px; }

		@keyframes popup-in {
			from { opacity: 0; transform: translateY(22px) scale(.92) rotate(-1deg); }
			to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
		}
		@keyframes image-reveal {
			from { opacity: 0; transform: scale(.88) rotate(2deg); }
			to { opacity: 1; transform: scale(1) rotate(0); }
		}
		@keyframes float-sparkle {
			0%, 100% { opacity: .35; transform: translateY(0) rotate(0); }
			50% { opacity: 1; transform: translateY(-8px) rotate(18deg); }
		}
		@media (prefers-reduced-motion: reduce) {
			dialog[open] .message-card, .message-card::before, .message-card::after, .message-card.has-image .message-image { animation: none; }
		}

		@media (max-width: 420px) { .name-list { grid-template-columns: 1fr; } }
	</style>
</head>
<body>

			<button class="name-button" data-name="Kevin" data-message="Happy 18th Birthday, Jam! Omg, you’re not a minor anymore. Kidding aside, even though we’ve only known each other for a few months, you’ve already done so many things for me. I’m so grateful to have you in my college journey. Wag tayo mag-FO, pleasee. I wish you all the best in life and enjoy your special day. Iloveyouuu, vabe!!">Kevin</button>
			<button class="name-button" data-name="Youngmee" data-message="Hi babyy, first of all, I couldn't be more thankful for our connection and the perfect timing of it all.

			<button class="name-button" data-name="Nicole" data-message="happy 18th birthday, our baby! 🤍

		<section class="boyfriend-section" aria-label="Message from your boyfriend">

			<button class="name-button boyfriend-button" data-name="Your Boyfriend" data-message="4 years ago, nagreply ako sa story mo without knowing na birthday mo pala. Ang dami na palang signs na sa'yo rin ako babagsak. Thank God kasi umabot tayo sa debut mo kahit ilang beses na tayong hindi nagkaintindihan at tampuhan. I want you to be extra special today kasi lagi ka namang special sa'kin araw-araw. Thank you kasi until now hindi ka pa rin nagbabago, ikaw pa rin yung maalaga, masungit in a good way, selosa, and iyakin na Jam na niligawan ko. I may not a good-looking guy or perfect boyfie for you but I want you to know that I'm trying to be enough for you. I will always be the guy na nakikinig sa mga hinanaing mo, yayakapin ka kapag pagod kana, hihilutin kapag may iniinda ka, at mamahalin ka sa tuwing naiisip mo na nag-iisa ka. I hope matupad mo yung mga goal mo in life, kasi  gusto kong nakikita kang masaya palagi. Ngayong 18 kana, ganap ka nang dalaga pero baby pa rin kita. Gusto ko lang na tandaan mo na nandito lang ako palagi, sayong-sayo, at habang-buhay na magiging sandalan mo. I love you pakiss ako ah:> " data-image="fa81f874-b89b-47c4-9095-708b67ccb2ef.jpg" data-image-alt="A romantic memory" data-video="1GFpjG_5ZV4">Open my message ♡</button>

	<dialog id="message-dialog" aria-labelledby="message-title">
		<div class="message-card">
			<div class="message-mark" aria-hidden="true">♡</div>
			<img class="message-image" id="message-image" alt="A romantic memory">
			<iframe class="message-video" id="message-video" title="Romantic audio for your message" allow="autoplay; encrypted-media"></iframe>
			<h2 id="message-title"></h2>
			<p id="message-text"></p>
			<button class="close-button" id="close-dialog" type="button">Choose another name</button>
		</div>
	</dialog>

	<script>
		const dialog = document.querySelector('#message-dialog');
		const messageTitle = document.querySelector('#message-title');
		const messageText = document.querySelector('#message-text');
		const messageImage = document.querySelector('#message-image');
		const messageVideo = document.querySelector('#message-video');
		const messageCard = document.querySelector('.message-card');
		const closeButton = document.querySelector('#close-dialog');

		document.querySelectorAll('.name-button').forEach((button) => {
			button.addEventListener('click', () => {
				messageTitle.textContent = `A message from ${button.dataset.name}`;
				messageText.textContent = button.dataset.message;
				messageCard.classList.toggle('has-image', Boolean(button.dataset.image));
				messageCard.classList.toggle('has-audio', Boolean(button.dataset.video));
				if (button.dataset.image) {
					messageImage.src = button.dataset.image;
					messageImage.alt = button.dataset.imageAlt;
				}
				dialog.showModal();
				if (button.dataset.video) {
					messageVideo.src = "d:\\keshi - Soft Spot (Acoustic) Official Audio.mp3";
				}
			});
		});

		const stopVideo = () => {
			messageVideo.src = '';
		};

		closeButton.addEventListener('click', () => dialog.close());
		dialog.addEventListener('close', stopVideo);
		dialog.addEventListener('click', (event) => {
			if (event.target === dialog) dialog.close();
		});
	</script>
</body>
</html>
